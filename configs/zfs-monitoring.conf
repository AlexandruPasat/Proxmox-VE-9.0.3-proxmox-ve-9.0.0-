UserParameter=zfs.health[*],/sbin/zpool list -H -o health $1 2>/dev/null
UserParameter=zfs.errors[*],/sbin/zpool status $1 2>/dev/null | grep -c -E 'DEGRADED|FAULTED|UNAVAIL|REMOVED|OFFLINE'
UserParameter=zfs.scrub[*],/sbin/zpool status $1 2>/dev/null | grep 'scan:' | sed 's/^[[:space:]]*//'
UserParameter=zfs.capacity[*],/sbin/zpool list -H -o capacity $1 2>/dev/null | tr -d '%'
